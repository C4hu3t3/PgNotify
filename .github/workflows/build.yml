name: Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PgNotify.Runtime.csproj etc. multi-target net10.0;net11.0 (see Directory.Build.props), so
      # the runner needs both SDKs side by side - the .NET 10 SDK alone fails with NETSDK1045 on
      # every net11.0 TargetFramework. .NET 11 is still preview (GA expected November 2026), hence
      # include-prerelease.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          include-prerelease: true

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Excludes PgNotify.IntegrationTests - run separately below so a failure there is
      # attributed clearly instead of being buried in one big test step. --collect:"XPlat Code
      # Coverage" uses coverlet.collector (already a PackageReference of every test project) to
      # write one coverage.cobertura.xml per (project, TFM) combination under ./TestResults -
      # already gitignored ([Tt]est[Rr]esult*/), so this needs no new ignore rule.
      - name: Run fast tests
        run: >
          dotnet test --no-build --configuration Release
          --filter "FullyQualifiedName!~IntegrationTests"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # ubuntu-latest runners have Docker pre-installed, so the Testcontainers-based suite (real
      # PostgreSQL via postgres:16-alpine) works without extra setup - see CLAUDE.md.
      - name: Run Docker integration tests
        run: >
          dotnet test tests/PgNotify.IntegrationTests/PgNotify.IntegrationTests.csproj
          --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # ReportGenerator merges every cobertura file above (net10.0 and net11.0 runs of the same
      # sources included) into one summary and writes it as GitHub-flavored markdown, which is
      # then appended straight to the run's Summary tab - no external service, no secret to store.
      - name: Publish coverage summary
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./TestResults/report" \
            -reporttypes:"MarkdownSummaryGithub"
          cat ./TestResults/report/*.md >> "$GITHUB_STEP_SUMMARY"

      # Tag pushes (v1.2.3) get that exact version; every other build gets a clearly-non-release
      # version so it's obvious these packages were never meant to be consumed.
      - name: Determine package version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: dotnet pack --no-build --configuration Release --output ./artifacts/nupkg -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish packages
    needs: build-test-pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release and attach the .nupkg files
      packages: write
      id-token: write # OIDC token for NuGet.org Trusted Publishing
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # GITHUB_TOKEN can publish to this repo's own (private) GitHub Packages NuGet registry -
      # no extra secrets to manage. --skip-duplicate makes re-running the workflow for the same
      # tag a no-op instead of a failure.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/nupkg/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      # Trusted Publishing: no long-lived secret to store or rotate. The OIDC token above
      # (id-token: write) is exchanged for a NuGet API key that's valid for 1 hour, scoped to
      # this one push - see docs.microsoft.com/nuget/nuget-org/trusted-publishing. The policy
      # matching this repo/workflow must be configured on nuget.org first.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: C4hu3t3

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "artifacts/nupkg/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      # gh is preinstalled on GitHub-hosted runners, so this needs no extra action/dependency.
      # --generate-notes drafts release notes from the commits/PRs since the previous tag.
      # --repo is required because this job has no actions/checkout step, so there's no local
      # git repository for gh to infer the target repo from.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/nupkg/*.nupkg \
            --repo "${{ github.repository }}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
