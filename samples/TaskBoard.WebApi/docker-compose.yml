services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskboard_sample
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433, not 5432: lets this sample run alongside CacheInvalidation.WebApi's own postgres.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
