services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders_sample
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # 5434, not 5432/5433: lets this sample run alongside CacheInvalidation.WebApi (5432) and
    # HttpCaching.WebApi/TaskBoard.WebApi (5433).
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
